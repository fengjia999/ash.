<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e1912">
  <title>登录 · 记忆网关</title>
  <link rel="icon" href="/static/ash-icon.png" type="image/png">
  <link rel="shortcut icon" href="/static/ash-icon.png">
  <link rel="apple-touch-icon" href="/static/ash-icon.png">
  <link rel="manifest" href="/static/site.webmanifest">
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101316; color: #eef1f4; }
    main { width: min(380px, calc(100vw - 32px)); padding: 30px; border: 1px solid #303840; border-radius: 18px; background: #191e23; box-shadow: 0 24px 70px #0008; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 24px; color: #9ba6af; font-size: 14px; }
    label { display: block; margin-bottom: 8px; font-size: 13px; color: #c8d0d6; }
    input, button { width: 100%; min-height: 46px; border-radius: 10px; font: inherit; }
    input { padding: 0 13px; color: #fff; background: #0f1316; border: 1px solid #3a444d; outline: none; }
    input:focus { border-color: #7fa4c7; box-shadow: 0 0 0 3px #7fa4c722; }
    button { margin-top: 14px; border: 0; background: #d8e3ec; color: #11171c; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #error { min-height: 20px; margin-top: 12px; color: #ff9b91; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>记忆网关</h1>
    <p>使用 Dashboard 密码登录管理界面。</p>
    <form id="loginForm">
      <label for="password">Dashboard 密码</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button id="submit" type="submit">登录</button>
      <div id="error" role="alert"></div>
    </form>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const button = document.getElementById('submit');
      const error = document.getElementById('error');
      button.disabled = true;
      error.textContent = '';
      try {
        const response = await fetch('/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({password: document.getElementById('password').value}),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || '登录失败');
        location.replace('/dashboard');
      } catch (reason) {
        error.textContent = reason.message || '登录失败';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
