<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Console</title>
<script src="/static/js/theme.js?v={{ static_version }}"></script>

<link rel="stylesheet" href="/static/css/prompt-paper.css?v={{ static_version }}">
</head>
<body{% if embedded %} class="dashboard-embedded"{% endif %}>

<div class="header">
  <div class="header-left">
    <h1>PROMPT CONSOLE</h1>
    <span class="stats" id="stats"></span>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="sections" aria-label="提示词段落" aria-pressed="true" title="提示词段落"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20S3 14.5 3 8.5C3 3.5 9 2.5 12 7c3-4.5 9-3.5 9 1.5C21 14.5 12 20 12 20Z"/></svg></button>
    <button class="tab-btn" data-tab="preview" aria-label="完整预览" aria-pressed="false" title="完整预览"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="tab-btn" data-tab="logs" aria-label="修改日志" aria-pressed="false" title="修改日志"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 15 10-11c2-2 5 1 3 3L8 18l-5 3 2-6Z M13 6l4 4M5 15l3 3"/></svg></button>
  </div>
</div>

<div class="container">
  <!-- 段落列表 -->
  <div class="tab-panel active" id="panel-sections">
    <div class="loading" id="sections-loading">Loading</div>
    <div id="sections-list"></div>
  </div>

  <!-- 完整预览 -->
  <div class="tab-panel" id="panel-preview">
    <div class="loading" id="preview-loading">Loading</div>
    <div class="preview-box" id="preview-content" style="display:none;"></div>
  </div>

  <!-- 修改日志 -->
  <div class="tab-panel" id="panel-logs">
    <div class="loading" id="logs-loading">Loading</div>
    <div id="logs-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CSRF_TOKEN = {{ csrf_token | tojson }};
const API_BASE = '';

function authFetch(url, options = {}) {
  const method = String(options.method || 'GET').toUpperCase();
  const headers = new Headers(options.headers || {});
  if (!['GET', 'HEAD', 'OPTIONS'].includes(method)) {
    headers.set('X-CSRF-Token', CSRF_TOKEN);
  }
  return fetch(url, {...options, headers}).then(resp => {
    if (resp.status === 401) location.assign('/login');
    return resp;
  });
}

// === Tab 切换 ===
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    btn.setAttribute('aria-pressed', 'true');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'preview') loadPreview();
    if (btn.dataset.tab === 'logs') loadLogs();
  });
});

// === Toast ===
function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => el.className = 'toast', 2500);
}

// === 加载段落 ===
const promptSectionsByKey = new Map();
async function loadSections() {
  try {
    const resp = await authFetch(API_BASE + '/api/prompt');
    const data = await resp.json();
    const sections = data.sections || [];
    promptSectionsByKey.clear();
    sections.forEach(section => promptSectionsByKey.set(section.key, section));

    document.getElementById('sections-loading').style.display = 'none';
    document.getElementById('stats').textContent =
      `${sections.length} sections · ${data.full_prompt_chars} chars`;

    const list = document.getElementById('sections-list');
    list.innerHTML = '';

    if (!sections.length) {
      list.innerHTML = '<div class="empty">No sections found.<br>Add &lt;!-- section:name locked/editable --&gt; markers to your prompt file.</div>';
      return;
    }

    // 按 priority 降序排列
    sections.sort((a, b) => (b.priority || 50) - (a.priority || 50));

    sections.forEach(s => {
      const card = document.createElement('div');
      card.className = 'section-card';
      card.dataset.sectionKey = s.key;
      const isEditable = s.mode === 'editable';
      const charCount = (s.content || '').length;

      card.innerHTML = `
        <div class="section-header" role="button" tabindex="0" aria-expanded="false" onclick="toggleSection(this)" onkeydown="if(event.target === this && (event.key === 'Enter' || event.key === ' ')){ event.preventDefault(); toggleSection(this); }">
          <div class="section-header-left">
            <span class="section-key">${esc(s.key)}</span>
            <span class="badge ${s.mode}">${s.mode}</span>
          </div>
          <span class="section-meta">${charCount} chars · P${s.priority || 50}</span>
        </div>
        ${isEditable ? `<button type="button" class="section-edit-shortcut btn-edit" aria-label="Edit ${esc(s.key)}" onclick="editPromptSection(this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 5 5-12 12-6 1 1-6L16 3Zm-2 2 5 5"/></svg></button>` : ''}
        <div class="section-body">
          <div class="section-content"></div>
          ${isEditable ? `
            <div class="edit-area" id="edit-${esc(s.key)}">
              <textarea id="textarea-${esc(s.key)}"></textarea>
              <input class="edit-reason" id="reason-${esc(s.key)}" type="text" aria-label="修改原因（可选）" placeholder="修改原因（可选）">
              <div class="edit-actions">
                <button class="btn btn-ghost" onclick="closeEdit('${esc(s.key)}')">Cancel</button>
                <button class="btn btn-primary" onclick="saveEdit('${esc(s.key)}')">Save</button>
              </div>
            </div>
            <p class="prompt-save-status" id="save-status-${esc(s.key)}" role="status" aria-live="polite"></p>
          ` : ''}
        </div>
      `;
      list.appendChild(card);
      if (isEditable) {
        const markDirty = () => {
          const status = document.getElementById('save-status-' + s.key);
          status.textContent = '尚未保存';
          status.dataset.state = 'dirty';
        };
        document.getElementById('textarea-' + s.key).addEventListener('input', markDirty);
        document.getElementById('reason-' + s.key).addEventListener('input', markDirty);
      }
    });
  } catch (e) {
    document.getElementById('sections-loading').textContent = 'Failed to load: ' + e.message;
  }
}

function toggleSection(header) {
  const body = header.closest('.section-card').querySelector('.section-body');
  body.classList.toggle('open');
  if (body.classList.contains('open') && !body.dataset.loaded) {
    const section = promptSectionsByKey.get(header.closest('.section-card').dataset.sectionKey);
    body.querySelector('.section-content').textContent = section?.content || '';
    body.dataset.loaded = 'true';
  }
  header.setAttribute('aria-expanded', String(body.classList.contains('open')));
}

function editPromptSection(button) {
  const card = button.closest('.section-card');
  const header = card.querySelector('.section-header');
  if (!card.querySelector('.section-body').classList.contains('open')) toggleSection(header);
  openEdit(card.dataset.sectionKey, card.querySelector('.btn-edit'));
}

function openEdit(key, btn) {
  const area = document.getElementById('edit-' + key);
  if (area) {
    const textarea = document.getElementById('textarea-' + key);
    if (!textarea.dataset.initialized) {
      textarea.value = promptSectionsByKey.get(key)?.content || '';
      textarea.dataset.initialized = 'true';
    }
    area.classList.add('open');
    btn.style.display = 'none';
    textarea.focus();
  }
}

function closeEdit(key) {
  const area = document.getElementById('edit-' + key);
  if (area) {
    area.classList.remove('open');
    // 恢复edit按钮
    const card = area.closest('.section-card');
    const editBtn = card.querySelector('.btn-edit');
    if (editBtn) editBtn.style.display = '';
  }
}

async function saveEdit(key) {
    const textarea = document.getElementById('textarea-' + key);
    if (!textarea) return;
    const area = document.getElementById('edit-' + key);
    if (area.dataset.saving === 'true') return;
    const status = document.getElementById('save-status-' + key);
    const content = textarea.value;
    const reason = document.getElementById('reason-' + key)?.value || '';
    const controls = [...area.querySelectorAll('button,textarea,input')];
    const button = area.querySelector('.btn-primary');
    area.dataset.saving = 'true';
    controls.forEach(control => { control.disabled = true; });
    button.textContent = '保存中…';
    status.textContent = '正在保存…';
    status.dataset.state = 'saving';
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    try {
    const resp = await authFetch(API_BASE + '/api/prompt/' + encodeURIComponent(key), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content, reason, edited_by: 'manual' }),
      signal: controller.signal,
    });
    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || 'HTTP ' + resp.status);
    const card = area.closest('.section-card');
    card.querySelector('.section-content').textContent = content;
    const section = promptSectionsByKey.get(key);
    if (section) section.content = content;
    card.querySelector('.section-meta').textContent = (data.new_char_count ?? data.chars ?? [...content].length) + ' chars · P' + (section?.priority || 50);
    status.textContent = '已保存 ✓ · ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
    status.dataset.state = 'saved';
    closeEdit(key);
    card.querySelector('.btn-edit')?.focus({preventScroll: true});
  } catch (e) {
    status.textContent = '保存失败：' + (e.name === 'AbortError' ? '请求超时，请重试' : e.message);
    status.dataset.state = 'error';
  } finally {
    clearTimeout(timer);
    area.dataset.saving = 'false';
    controls.forEach(control => { control.disabled = false; });
    button.textContent = 'Save';
  }
}

// === 预览 ===
async function loadPreview() {
  try {
    document.getElementById('preview-loading').style.display = 'block';
    document.getElementById('preview-content').style.display = 'none';

    const resp = await authFetch(API_BASE + '/api/prompt/splice-preview');
    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || 'HTTP ' + resp.status);

    document.getElementById('preview-loading').style.display = 'none';
    const box = document.getElementById('preview-content');
    box.style.display = 'block';
    box.textContent = data.content || '(empty)';
  } catch (e) {
    document.getElementById('preview-loading').textContent = 'Failed: ' + e.message;
  }
}

// === 日志 ===
async function loadLogs() {
  try {
    document.getElementById('logs-loading').style.display = 'block';

    const resp = await authFetch(API_BASE + '/api/prompt/log');
    const data = await resp.json();
    const logs = (data.logs || []).reverse(); // 最新在前

    document.getElementById('logs-loading').style.display = 'none';
    const list = document.getElementById('logs-list');
    list.innerHTML = '';

    if (!logs.length) {
      list.innerHTML = '<div class="empty">No edit logs yet.</div>';
      return;
    }

    logs.forEach(log => {
      const entry = document.createElement('div');
      entry.className = 'log-entry';

      const editedByAssistant = log.edited_by && log.edited_by !== 'manual';
      const byClass = editedByAssistant ? 'by-assistant' : 'by-manual';
      const byLabel = editedByAssistant ? '助手' : '👤 Manual';

      entry.innerHTML = `
        <div class="log-meta">
          <span>${esc(log.time || '')}</span>
          <span class="${byClass}">${byLabel}</span>
          <span>section: <strong>${esc(log.section || '')}</strong></span>
        </div>
        ${log.reason ? `<div class="log-reason">"${esc(log.reason)}"</div>` : ''}
        <div class="log-diff">
          <div>
            <div class="log-diff-label">Before</div>
            <div class="log-diff-box old">${esc(log.old || '')}</div>
          </div>
          <div>
            <div class="log-diff-label">After</div>
            <div class="log-diff-box new">${esc(log.new || '')}</div>
          </div>
        </div>
      `;
      list.appendChild(entry);
    });
  } catch (e) {
    document.getElementById('logs-loading').textContent = 'Failed: ' + e.message;
  }
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// 初始加载
loadSections();
if (document.body.classList.contains('dashboard-embedded') && window.parent !== window) {
  let heightFrame;
  const publishHeight = () => {
    cancelAnimationFrame(heightFrame);
    heightFrame = requestAnimationFrame(() => window.parent.postMessage({
      type: 'memory-gateway-prompt-height', height: document.body.getBoundingClientRect().height
    }, window.location.origin));
  };
  new ResizeObserver(publishHeight).observe(document.body);
  window.addEventListener('load', publishHeight);
  publishHeight();
}
</script>
</body>
</html>
